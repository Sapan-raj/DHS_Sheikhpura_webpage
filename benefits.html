<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Health Services for Citizens — District Health Society, Sheikhpura</title>
<meta name="description" content="Every free health service, medicine, test and cash benefit you are entitled to in Sheikhpura district — who can get it, where to go and what to carry.">
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<a class="skip-link" href="#page">Skip to main content</a>
<div id="shell-top"></div>
<div id="crumbs"></div>
<main id="page"><div class="container section"><div class="skel" style="height:90px;margin-bottom:20px"></div><div class="skel" style="height:320px"></div></div></main>
<div id="shell-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script>
UI.boot('benefits.html', function (d) {
  var Q = PortalData.query, esc = PortalData.esc;
  UI.crumbs([{ label: 'Free Health Services' }]);

  var cy = Q.currentYear(d);
  var cats = Q.categories(d);
  var types = Q.benefitTypes(d);
  var catOf = {}; d.categories.forEach(function (c) { catOf[c.Category_ID] = c; });

  document.getElementById('page').innerHTML =
    '<section class="section benefit-band"><div class="container">' +
      '<div class="section-head">' +
        '<h2>Free Health Services for the People of Sheikhpura</h2>' +
        '<p style="max-width:78ch">Every service listed here is provided <strong>free of cost</strong> at government ' +
        'health facilities in the district. If anyone asks you to pay for these, you have the right to complain — ' +
        'call <a href="tel:104">104</a>.</p>' +
      '</div>' +
      '<div class="grid grid-4" id="bStats"></div>' +
    '</div></section>' +

    '<section class="section"><div class="container">' +
      '<div class="filters filters--3">' +
        '<div class="field search-field"><label for="q">Search services</label>' +
          '<input id="q" type="search" placeholder="e.g. delivery, TB, dialysis, ambulance, cataract…" value="' + esc(UI.param('q')) + '" autocomplete="off"></div>' +
        '<div class="field"><label for="ty">Type of help</label><select id="ty"><option value="">All types</option>' +
          types.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label for="cat">Health area</label><select id="cat"><option value="">All areas</option>' +
          cats.map(function (c) { return '<option value="' + esc(c.Category_ID) + '">' + esc(c.Short_Name) + ' — ' + esc(c.Category_Name) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label>&nbsp;</label><button class="btn btn-outline" id="reset" type="button">Reset</button></div>' +
      '</div>' +
      '<div class="result-line" id="rl"></div>' +
      '<div id="list"></div>' +
    '</div></section>' +

    '<section class="section section--alt"><div class="container"><div class="card">' +
      '<h2>Know your rights</h2>' +
      '<ul style="max-width:88ch;color:var(--text-muted);line-height:1.9;padding-left:20px">' +
        '<li>Every service on this page is <strong>free</strong> at a government health facility. Nobody may charge you for it.</li>' +
        '<li>Essential medicines and essential tests are free. You should not be sent outside to buy them.</li>' +
        '<li>The <strong>102</strong> and <strong>108</strong> ambulances are free, including the drop back home.</li>' +
        '<li>Treatment cannot be refused because you do not have a card or a document.</li>' +
        '<li>If you are charged, refused treatment, or treated badly — call <a href="tel:104">104</a> and complain. ' +
          'Give the name of the facility, the date and what happened.</li>' +
      '</ul>' +
      '<p style="font-size:.83rem;color:var(--text-muted);margin:16px 0 0;max-width:88ch">' +
        'Cash amounts shown are as per current government norms and are revised from time to time. ' +
        'Please confirm the exact amount at the health facility or by calling 104.</p>' +
    '</div></div></section>';

  /* headline numbers, computed from the data */
  var all = Q.allBenefits(d);
  var freeCount = all.filter(function (b) { return /^free/i.test(String(b.Amount || '')); }).length;
  var cashCount = all.filter(function (b) { return b.Benefit_Type === 'Cash Benefit'; }).length;
  var progCount = all.map(function (b) { return b._code; })
                     .filter(function (v, i, a) { return a.indexOf(v) === i; }).length;
  document.getElementById('bStats').innerHTML = [
    [all.length, 'Services listed'], [freeCount, 'Completely free'],
    [cashCount, 'Cash benefits'], [progCount, 'Health programmes']
  ].map(function (t) {
    return '<div class="card stat" style="border-left-color:var(--green)">' +
      '<div class="num" style="color:var(--green)">' + t[0] + '</div>' +
      '<div class="lbl">' + t[1] + '</div></div>';
  }).join('');

  function draw() {
    var rows = Q.allBenefits(d, {
      q: document.getElementById('q').value,
      type: document.getElementById('ty').value,
      categoryId: document.getElementById('cat').value
    });

    /* group by health area so a citizen can scan by need, not by budget code */
    var groups = [], seen = {};
    rows.forEach(function (b) {
      var key = b._category ? b._category.Category_ID : 'other';
      if (!seen[key]) { seen[key] = { cat: b._category, items: [] }; groups.push(seen[key]); }
      seen[key].items.push(b);
    });

    document.getElementById('list').innerHTML = rows.length
      ? groups.map(function (g) {
          return '<div class="b-group-head">' +
              '<h3>' + esc(g.cat ? g.cat.Category_Name : 'Other services') + '</h3>' +
              '<span class="b-count">' + g.items.length + ' service' + (g.items.length === 1 ? '' : 's') + '</span>' +
            '</div>' +
            '<div class="grid grid-3">' +
              g.items.map(function (b) {
                return UI.benefitCard(b, { showProgram: true, fy: cy ? cy.Financial_Year : '' });
              }).join('') +
            '</div>';
        }).join('')
      : UI.emptyState('No service matches your search',
          'Try a simpler word, such as "delivery", "TB", "eye" or "ambulance".');

    document.getElementById('rl').innerHTML = rows.length
      ? 'Showing <strong>' + rows.length + '</strong> service' + (rows.length === 1 ? '' : 's')
      : 'No services found';
  }

  ['q', 'ty', 'cat'].forEach(function (id) {
    document.getElementById(id).addEventListener(id === 'q' ? 'input' : 'change', draw);
  });
  document.getElementById('reset').addEventListener('click', function () {
    ['q', 'ty', 'cat'].forEach(function (id) { document.getElementById(id).value = ''; });
    draw();
  });

  draw();
});
</script>
</body>
</html>
