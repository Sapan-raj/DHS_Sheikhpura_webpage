<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Programmes — District Health Society, Sheikhpura</title>
<meta name="description" content="The health programmes running in Sheikhpura district and the free services each one provides to residents.">
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<a class="skip-link" href="#page">Skip to main content</a>
<div id="shell-top"></div>
<div id="crumbs"></div>
<main id="page"><div class="container section"><div class="skel" style="height:90px;margin-bottom:20px"></div><div class="skel" style="height:320px"></div></div></main>
<div id="shell-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script>
UI.boot('programmes.html', function (d) {
  var Q = PortalData.query, esc = PortalData.esc;
  UI.crumbs([{ label: 'Health Programmes' }]);

  var cy = Q.currentYear(d);
  var cats = Q.categories(d);

  /* Only programmes that actually give a resident something. The purely
     administrative heads — programme management, technical assistance,
     untied grants — are internal and are not shown to the public. */
  var progs = (cy ? Q.programmes(d, cy.Year_ID) : []);

  document.getElementById('page').innerHTML =
    '<section class="section"><div class="container">' +
      '<div class="section-head"><h2>Health Programmes in Sheikhpura</h2>' +
      '<p style="max-width:78ch">These are the health programmes the district runs. Each one lists the services ' +
      'you can get free of cost, who is eligible, and where to go.</p></div>' +
      '<div class="filters filters--2">' +
        '<div class="field search-field"><label for="q">Search programmes</label>' +
          '<input id="q" type="search" placeholder="e.g. maternal, TB, eye, child, diabetes…" value="' + esc(UI.param('q')) + '" autocomplete="off"></div>' +
        '<div class="field"><label for="cat">Health area</label><select id="cat"><option value="">All areas</option>' +
          cats.map(function (c) { return '<option value="' + esc(c.Category_ID) + '">' + esc(c.Category_Name) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label>&nbsp;</label><button class="btn btn-outline" id="reset" type="button">Reset</button></div>' +
      '</div>' +
      '<div class="result-line" id="rl"></div>' +
      '<div id="list"></div>' +
    '</div></section>';

  function draw() {
    var q = document.getElementById('q').value.toLowerCase().trim();
    var cat = document.getElementById('cat').value;

    var rows = progs.filter(function (p) {
      if (cat && p.Category_ID !== cat) return false;
      if (!q) return true;
      var bens = Q.benefitsFor(d, p.FMR_Code, p.Year_ID);
      return [p.Program_Name, p.Program_Name_HI, p.Program_Description]
        .concat(bens.map(function (b) { return b.Benefit_Title + ' ' + b.Benefit_Description; }))
        .join(' ').toLowerCase().indexOf(q) > -1;
    });

    /* group by health area so a resident scans by need */
    var groups = [], seen = {};
    var catOf = {}; cats.forEach(function (c) { catOf[c.Category_ID] = c; });
    rows.forEach(function (p) {
      var k = p.Category_ID;
      if (!seen[k]) { seen[k] = { cat: catOf[k], items: [] }; groups.push(seen[k]); }
      seen[k].items.push(p);
    });

    document.getElementById('list').innerHTML = rows.length
      ? groups.map(function (g) {
          return '<div class="b-group-head">' +
              '<h3>' + esc(g.cat ? g.cat.Category_Name : 'Other') + '</h3>' +
              '<span class="b-count">' + g.items.length + ' programme' + (g.items.length === 1 ? '' : 's') + '</span>' +
            '</div><div class="grid grid-3">' +
            g.items.map(function (p) {
              var bens = Q.benefitsFor(d, p.FMR_Code, p.Year_ID);
              var href = 'program.html?p=' + encodeURIComponent(p.Program_ID);
              return '<a class="card card--link cat-card" href="' + href + '">' +
                '<div class="cat-top"><span class="cat-icon">' + esc((g.cat && g.cat.Short_Name) || '•') + '</span>' +
                  '<div><h3 style="margin:0">' + esc(UI.t(p.Program_Name, p.Program_Name_HI)) + '</h3>' +
                  '<span class="count">' + bens.length + ' free service' + (bens.length === 1 ? '' : 's') + '</span></div></div>' +
                (p.Program_Description ? '<p>' + esc(p.Program_Description) + '</p>' : '') +
                (bens.length
                  ? '<div class="post-chips" style="margin-top:auto">' +
                    bens.slice(0, 3).map(function (b) {
                      return '<span class="chip b-free">' + esc(b.Benefit_Title.split('—')[0].trim().slice(0, 30)) + '</span>';
                    }).join('') +
                    (bens.length > 3 ? '<span class="chip">+' + (bens.length - 3) + ' more</span>' : '') +
                    '</div>' : '') +
              '</a>';
            }).join('') + '</div>';
        }).join('')
      : UI.emptyState('No programme matches your search',
          'Try a simpler word, such as "mother", "child", "TB" or "eye".');

    document.getElementById('rl').innerHTML = rows.length
      ? 'Showing <strong>' + rows.length + '</strong> programme' + (rows.length === 1 ? '' : 's')
      : 'No programmes found';
  }

  ['q', 'cat'].forEach(function (id) {
    document.getElementById(id).addEventListener(id === 'q' ? 'input' : 'change', draw);
  });
  document.getElementById('reset').addEventListener('click', function () {
    ['q', 'cat'].forEach(function (id) { document.getElementById(id).value = ''; });
    draw();
  });

  draw();
});
</script>
</body>
</html>
