<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health Programme — District Health Society, Sheikhpura</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<a class="skip-link" href="#page">Skip to main content</a>
<div id="shell-top"></div>
<div id="crumbs"></div>
<main id="page"><div class="container section"><div class="skel" style="height:320px"></div></div></main>
<div id="shell-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script>
/* ------------------------------------------------------------------
   One health programme, written for a resident.
   No budget figures, no FMR codes, no allocation documents — this
   portal publishes what people can use, not the district's finances.
   ------------------------------------------------------------------ */
UI.boot('programmes.html', function (d) {
  var Q = PortalData.query, esc = PortalData.esc;
  var cy = Q.currentYear(d);

  /* ?p=PRG0001 is canonical. ?fmr= is kept so older links still resolve. */
  var prog = Q.programById(d, UI.param('p'));
  if (!prog && UI.param('fmr') && cy) prog = Q.programByCode(d, cy.Year_ID, UI.param('fmr'));

  if (!prog) {
    UI.crumbs([{ label: 'Health Programmes', url: 'programmes.html' }, { label: 'Not found' }]);
    document.getElementById('page').innerHTML = '<div class="container section">' +
      UI.emptyState('Programme not found',
        'This programme may have been renamed or is no longer running. Browse all programmes below.') +
      '<div style="text-align:center"><a class="btn btn-primary" href="programmes.html">All health programmes</a></div></div>';
    return;
  }

  var cat = d.categories.filter(function (c) { return c.Category_ID === prog.Category_ID; })[0] || {};
  var benefits = Q.benefitsFor(d, prog.FMR_Code, prog.Year_ID);
  var docs = Q.docsForProgram(d, prog.Program_ID);
  var title = UI.t(prog.Program_Name, prog.Program_Name_HI);

  UI.crumbs([{ label: 'Health Programmes', url: 'programmes.html' }, { label: title }]);
  document.title = title + ' — ' + (d.settings.site_title || '');

  /* other programmes in the same health area */
  var sibs = (cy ? Q.programmes(d, cy.Year_ID) : [])
    .filter(function (p) { return p.Category_ID === prog.Category_ID && p.Program_ID !== prog.Program_ID; });

  var H = '<section class="section"><div class="container">';

  /* ── header ── */
  H += '<div class="card" style="border-top:4px solid var(--green);margin-bottom:24px">' +
    '<div class="post-chips" style="margin-bottom:10px">' +
      '<a class="chip" href="programmes.html">' + esc(cat.Category_Name || 'Health Programme') + '</a>' +
      (benefits.length ? '<span class="chip b-free">' + benefits.length + ' free service' +
        (benefits.length === 1 ? '' : 's') + '</span>' : '') +
    '</div>' +
    '<h1 style="margin:0 0 8px;font-size:1.6rem">' + esc(title) + '</h1>' +
    (prog.Program_Description
      ? '<p style="color:var(--text-muted);margin:0;max-width:80ch">' + esc(prog.Program_Description) + '</p>' : '') +
  '</div>';

  /* ── what you get — the whole point of the page ── */
  if (benefits.length) {
    H += '<div class="section-head" style="margin-bottom:16px">' +
        '<h2 style="border-bottom-color:var(--green)">What you get</h2>' +
        '<p>Free of cost at government health facilities in Sheikhpura. ' +
        'If anyone asks you to pay, call <a href="tel:104">104</a>.</p>' +
      '</div>' +
      '<div class="grid grid-2" style="margin-bottom:32px">' +
        benefits.map(function (b) { return UI.benefitCard(b); }).join('') +
      '</div>';
  } else {
    H += '<div class="card" style="margin-bottom:32px">' +
      UI.emptyState('No individual services listed yet',
        'This programme supports health services in the district. Specific entitlements will be listed here as they are published.') +
      '</div>';
  }

  /* ── supporting information ── */
  H += '<div class="grid grid-2" style="align-items:start">';

  H += '<div class="card"><h3>Where to go</h3>' +
    '<p style="color:var(--text-muted);margin:0 0 14px">These services are available at government health ' +
    'facilities across the district. Your nearest Ayushman Arogya Mandir or ASHA can direct you.</p>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<a class="btn btn-outline btn-sm" href="contact.html">District contacts</a>' +
      '<a class="btn btn-outline btn-sm" href="tel:104">☎ Call 104</a>' +
      '<a class="btn btn-outline btn-sm" href="tel:102">⛑ Ambulance 102</a>' +
    '</div></div>';

  if (docs.length) {
    H += '<div class="card"><h3>Related documents</h3>' +
      docs.map(function (x) {
        return UI.docRow({ title: x.Document_Title, type: x.Document_Type, desc: x.Description,
                           url: x._url, fileType: x.File_Type, size: x.File_Size_MB, date: x.Upload_Date });
      }).join('') + '</div>';
  } else {
    H += '<div class="card"><h3>More help</h3>' +
      '<p style="color:var(--text-muted);margin:0 0 14px">Browse everything the district provides free of cost, ' +
      'or see what is happening this month.</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<a class="btn btn-outline btn-sm" href="benefits.html">All free services</a>' +
        '<a class="btn btn-outline btn-sm" href="events.html">Events &amp; news</a>' +
      '</div></div>';
  }
  H += '</div>';

  /* ── siblings ── */
  if (sibs.length) {
    H += '<div class="section-head" style="margin-top:32px"><h2>Other ' +
      esc(cat.Category_Name || 'health') + ' programmes</h2></div>' +
      '<div class="grid grid-3">' +
      sibs.map(function (p) {
        var n = Q.benefitsFor(d, p.FMR_Code, p.Year_ID).length;
        return '<a class="card card--link cat-card" href="program.html?p=' + encodeURIComponent(p.Program_ID) + '">' +
          '<div class="cat-top"><span class="cat-icon">' + esc(cat.Short_Name || '•') + '</span>' +
          '<div><h3 style="margin:0">' + esc(UI.t(p.Program_Name, p.Program_Name_HI)) + '</h3>' +
          '<span class="count">' + n + ' free service' + (n === 1 ? '' : 's') + '</span></div></div></a>';
      }).join('') + '</div>';
  }

  H += '</div></section>';
  document.getElementById('page').innerHTML = H;
});
</script>
</body>
</html>
